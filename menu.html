<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="restaurant.css"/>
    <title>Menu</title>
</head>
<body>
    <header class="header">
        <a href="home.html" class="logo">
            Restaurant <span> & </span> Cafe
        </a>
        <i class="menu" id="menu-icon"></i>
        <nav class="navbar">
            <a href="home.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="maps.html">Maps</a>
            <a href="contact.html">Contact</a>
        </nav>
        <button onclick="document.location='login.html'" class="login-btn">Login</button>
    </header>
    
    <section class="restaurants" id="restaurants">
        <h1>Our Menu</h1>
        <div class="restaurant-box">
            <div class="menu-card">
                <img src="Sandwich.jpg" alt="Sandwich">
                <h3>Sandwich</h3>
                <div class="btn">Add to Cart</div>
            </div>
            <div class="menu-card">
                <img src="MasalaChai.jpg" alt="MasalaChai">
                <h3>Masala Chai</h3>
                <div class="btn">Add to Cart</div>
            </div>
            <div class="menu-card">
                <img src="sushi.avif" alt="sushi">
                <h3>Sushi</h3>
                <div class="btn">Add to Cart</div>
            </div>
            <div class="menu-card">
                <img src="images/restaurant1.jpg" alt="Restaurant 1">
                <h3>Restaurant 3</h3>
                <div class="btn">Daily menu</div>
                <div class="btn">Weekly menu</div>
            </div>
            <div class="menu-card">
                <img src="images/restaurant1.jpg" alt="Restaurant 1">
                <h3>Restaurant 4</h3>
                <div class="btn">Daily menu</div>
                <div class="btn">Weekly menu</div>
            </div>
            <div class="menu-card">
                <img src="images/restaurant1.jpg" alt="Restaurant 1">
                <h3>Restaurant 5</h3>
                <div class="btn">Daily menu</div>
                <div class="btn">Weekly menu</div>
            </div>
        </div>
    </section>

</html>
